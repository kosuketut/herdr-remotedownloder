[package]
name = "herdr-remote-download"
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
description = "Transfer files between a remote Herdr pane and the connected Mac."
license = "MIT"
repository = "https://github.com/kosuketut/herdr-remotedownloder"
readme = "README.md"

[[bin]]
name = "herdr-remote-download-picker"
path = "src/main.rs"

[[bin]]
name = "herdr-remote-download"
path = "src/bin/herdr-remote-download.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
herdr-tiny-fingers = { git = "https://github.com/hotchpotch/herdr-tiny-fingers.git", rev = "2c817583fa1d5385fe4a95e2fd4cfa30fa4e915e" }
ratatui = "0.30"
regex = "1"
serde_json = "1"
sha2 = "0.10"
