[package]
name = "herdr-remote-download-picker"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Select a file path in a remote Herdr pane and download it to the connected Mac."
license = "MIT"
repository = "https://github.com/kosuketut/herdr-remotedownloder"
readme = "README.md"

[[bin]]
name = "herdr-remote-download-picker"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.29"
herdr-tiny-fingers = { git = "https://github.com/hotchpotch/herdr-tiny-fingers.git", rev = "2c817583fa1d5385fe4a95e2fd4cfa30fa4e915e" }
ratatui = "0.30"
serde_json = "1"
