id = "kosukeyano.remote-download"
name = "Remote File Download"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Download a selected remote file to the machine running herdr --remote."
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[actions]]
id = "pick"
title = "Pick a remote file to download"
description = "Show hints for existing file paths in the focused pane."
contexts = ["pane"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin kosukeyano.remote-download --entrypoint picker"]

[[actions]]
id = "download"
title = "Download selected remote file"
description = "Send the selected file path to the connected machine."
contexts = ["selection", "pane"]
command = ["python3", "herdr_remote_download.py", "send-context"]

[[link_handlers]]
id = "file-url"
title = "Download remote file"
pattern = "^file://.*$"
action = "download"

[[panes]]
id = "picker"
title = "Remote file download"
placement = "overlay"
command = ["./target/release/herdr-remote-download-picker"]
