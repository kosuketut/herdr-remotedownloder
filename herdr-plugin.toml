id = "kosukeyano.remote-download"
name = "Remote File Transfer"
version = "0.4.0"
min_herdr_version = "0.7.0"
description = "Transfer files between a remote Herdr pane and the connected Mac."
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[actions]]
id = "pick"
title = "Pick a remote file to download"
description = "Show hints for existing file paths in the focused pane."
contexts = ["pane"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin kosukeyano.remote-download --entrypoint picker"]

[[actions]]
id = "download"
title = "Download selected remote file"
description = "Send the selected file path to the connected machine."
contexts = ["selection", "pane"]
command = ["./target/release/herdr-remote-download", "send-context"]

[[actions]]
id = "upload"
title = "Upload files from the connected Mac"
description = "Open the Mac file picker and save the selected files in the focused pane's current directory."
contexts = ["pane"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin kosukeyano.remote-download --entrypoint uploader"]

[[link_handlers]]
id = "file-url"
title = "Download remote file"
pattern = "^file://.*$"
action = "download"

[[panes]]
id = "picker"
title = "Remote file download"
placement = "overlay"
command = ["./target/release/herdr-remote-download-picker"]

[[panes]]
id = "uploader"
title = "Upload from Mac"
placement = "overlay"
command = ["python3", "./herdr_remote_upload.py", "upload-context", "--interactive"]
